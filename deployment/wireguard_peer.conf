# deployment/wireguard_peer.conf
[Interface]
# Local private key generated on this edge camera node
PrivateKey = eHw231aSKJDHAoas8718aSKDJHAoas8718aSKDJHA=
# Static overlay IP assigned to this edge gateway
Address = 10.8.0.14/24
DNS = 10.8.0.1

[Peer]
# Central cloud gateway VPN server public key
PublicKey = sDKJHAoas8718aSKDJHAoas8718aSKDJHAoas8718=
# Preshared key for post-quantum symmetric encryption security
PresharedKey = pSKDJHAoas8718aSKDJHAoas8718aSKDJHAoas87=
# Route only traffic bound for private cloud overlay networks (10.8.0.0/24)
# keeping local public internet traffic un-tunneled
AllowedIPs = 10.8.0.0/24
# Public cloud address and port of the WireGuard hub
Endpoint = vpn.edgevision-prod.cloud:51820
# Keep connection active behind NAT routers via persistent keepalives
PersistentKeepalive = 25
